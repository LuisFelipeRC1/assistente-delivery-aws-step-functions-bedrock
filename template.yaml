AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Assistente de Delivery com AWS Step Functions, Lambda, DynamoDB e Amazon Bedrock.

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    Description: ID do modelo do Amazon Bedrock utilizado para personalizar a mensagem do pedido.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: delivery-assistant
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - "*"
      AllowHeaders:
        - Content-Type
      AllowMethods:
        - GET
        - POST

Resources:
  DeliveryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/create_order/
      Handler: app.lambda_handler
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          STATE_MACHINE_ARN: !Ref DeliveryStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - Statement:
            - Sid: StartDeliveryWorkflow
              Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref DeliveryStateMachine
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeliveryApi
            Path: /orders
            Method: POST

  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_order/
      Handler: app.lambda_handler
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Events:
        GetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeliveryApi
            Path: /orders/{orderId}
            Method: GET

  ValidateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/validate_order/
      Handler: app.lambda_handler

  ProcessPaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/process_payment/
      Handler: app.lambda_handler

  UpdateStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/update_status/
      Handler: app.lambda_handler
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable

  DeliveryStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  DeliveryStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/delivery.asl.json
      DefinitionSubstitutions:
        ValidateOrderFunctionArn: !GetAtt ValidateOrderFunction.Arn
        ProcessPaymentFunctionArn: !GetAtt ProcessPaymentFunction.Arn
        UpdateStatusFunctionArn: !GetAtt UpdateStatusFunction.Arn
        BedrockModelId: !Ref BedrockModelId
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt DeliveryStateMachineLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL
      Tracing:
        Enabled: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ValidateOrderFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ProcessPaymentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref UpdateStatusFunction
        - CloudWatchLogsFullAccess
        - Statement:
            - Sid: InvokeConfiguredBedrockModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}

Outputs:
  DeliveryApiUrl:
    Description: URL base da API do Assistente de Delivery.
    Value: !Sub https://${DeliveryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod
  DeliveryStateMachineArn:
    Description: ARN da máquina de estados.
    Value: !Ref DeliveryStateMachine
  OrdersTableName:
    Description: Nome da tabela de pedidos.
    Value: !Ref OrdersTable
